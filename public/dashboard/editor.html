<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Editor - Dashboard</title>
  <link rel="stylesheet" href="/dashboard/dashboard.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>HBS</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard/" class="sidebar-link">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a href="/dashboard/stories.html" class="sidebar-link">
          <i data-lucide="book-open"></i>
          <span>Stories</span>
        </a>
        <a href="/dashboard/landing.html" class="sidebar-link">
          <i data-lucide="home"></i>
          <span>Landing Page</span>
        </a>
        <a href="/dashboard/messages.html" class="sidebar-link">
          <i data-lucide="mail"></i>
          <span>Messages</span>
        </a>
        <a href="/dashboard/media.html" class="sidebar-link">
          <i data-lucide="image"></i>
          <span>Media</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="/" class="sidebar-link">
          <i data-lucide="external-link"></i>
          <span>View Site</span>
        </a>
        <button id="logout-btn" class="sidebar-link" style="background: none; border: none; cursor: pointer; width: 100%; text-align: left;">
          <i data-lucide="log-out"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <h1 id="editor-title">New Story</h1>
      </header>

      <div class="dashboard-section">
        <form id="story-form">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
          </div>
          <div class="form-group">
            <label for="slug">Slug (URL)</label>
            <input type="text" id="slug" name="slug" required>
          </div>
          <div class="form-group">
            <label for="summary">Summary</label>
            <textarea id="summary" name="summary" maxlength="500" required></textarea>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" required>
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" required>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cover_image_url">Cover Image URL</label>
            <input type="text" id="cover_image_url" name="cover_image_url">
          </div>
          <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="12" required></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Story</button>
            <a href="/dashboard/stories.html" class="btn btn-secondary">Cancel</a>
          </div>
          <div id="editor-status" style="margin-top: 16px;"></div>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/main.js"></script>
  <script src="/dashboard/editor.js"></script>
</body>
</html>
