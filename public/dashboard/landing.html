<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page - Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="stylesheet" href="/dashboard/dashboard.css">
  <link rel="stylesheet" href="/css/icons.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none;" aria-hidden="true">
    <symbol id="i-layout-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></symbol>
    <symbol id="i-book-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-7a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h8z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="i-external-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>
    <symbol id="i-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
  </svg>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>HBS</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard/" class="sidebar-link">
          <svg class="icon"><use href="#i-layout-dashboard"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="/dashboard/stories.html" class="sidebar-link">
          <svg class="icon"><use href="#i-book-open"/></svg>
          <span>Stories</span>
        </a>
        <a href="/dashboard/landing.html" class="sidebar-link active">
          <svg class="icon"><use href="#i-home"/></svg>
          <span>Landing Page</span>
        </a>
        <a href="/dashboard/messages.html" class="sidebar-link">
          <svg class="icon"><use href="#i-mail"/></svg>
          <span>Messages</span>
        </a>
        <a href="/dashboard/media.html" class="sidebar-link">
          <svg class="icon"><use href="#i-image"/></svg>
          <span>Media</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="/" class="sidebar-link">
          <svg class="icon"><use href="#i-external-link"/></svg>
          <span>View Site</span>
        </a>
        <button id="logout-btn" class="sidebar-link" style="background: none; border: none; cursor: pointer; width: 100%; text-align: left;">
          <svg class="icon"><use href="#i-log-out"/></svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <h1>Landing Page Settings</h1>
      </header>

      <div class="dashboard-section">
        <form id="settings-form">
          <div class="form-group">
            <label for="hero_title">Hero Title</label>
            <input type="text" id="hero_title" name="hero_title" required>
          </div>
          <div class="form-group">
            <label for="hero_subtitle">Hero Subtitle</label>
            <textarea id="hero_subtitle" name="hero_subtitle" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label for="hero_cta_text">Hero CTA Text</label>
            <input type="text" id="hero_cta_text" name="hero_cta_text" required>
          </div>
          <div class="form-group">
            <label for="hero_image_url">Hero Image URL</label>
            <input type="text" id="hero_image_url" name="hero_image_url">
          </div>
          <div class="form-group">
            <label for="about_title">About Title</label>
            <input type="text" id="about_title" name="about_title" required>
          </div>
          <div class="form-group">
            <label for="about_content">About Content</label>
            <textarea id="about_content" name="about_content" rows="6" required></textarea>
          </div>
          <div class="form-group">
            <label for="writer_name">Writer Name</label>
            <input type="text" id="writer_name" name="writer_name" required>
          </div>
          <div class="form-group">
            <label for="writer_bio">Writer Bio</label>
            <textarea id="writer_bio" name="writer_bio" rows="4" required></textarea>
          </div>
          <div class="form-group">
            <label for="facebook_url">Facebook URL</label>
            <input type="text" id="facebook_url" name="facebook_url">
          </div>
          <div class="form-group">
            <label for="contact_email">Contact Email</label>
            <input type="email" id="contact_email" name="contact_email">
          </div>
          <div class="form-group">
            <label for="contact_phone">Contact Phone</label>
            <input type="text" id="contact_phone" name="contact_phone">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Settings</button>
          </div>
          <div id="settings-status" style="margin-top: 16px;"></div>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/main.js"></script>
  <script src="/dashboard/landing.js"></script>
</body>
</html>
