<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Hope Beyond Shores</title>
  <link rel="stylesheet" href="/dashboard/dashboard.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>HBS</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard/" class="sidebar-link active">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a href="/dashboard/stories.html" class="sidebar-link">
          <i data-lucide="book-open"></i>
          <span>Stories</span>
        </a>
        <a href="/dashboard/landing.html" class="sidebar-link">
          <i data-lucide="home"></i>
          <span>Landing Page</span>
        </a>
        <a href="/dashboard/messages.html" class="sidebar-link">
          <i data-lucide="mail"></i>
          <span>Messages</span>
        </a>
        <a href="/dashboard/media.html" class="sidebar-link">
          <i data-lucide="image"></i>
          <span>Media</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="/" class="sidebar-link">
          <i data-lucide="external-link"></i>
          <span>View Site</span>
        </a>
        <button id="logout-btn" class="sidebar-link" style="background: none; border: none; cursor: pointer; width: 100%; text-align: left;">
          <i data-lucide="log-out"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <h1>Dashboard</h1>
      </header>

      <div class="dashboard-stats">
        <div class="stat-card">
          <div class="stat-icon"><i data-lucide="book-open"></i></div>
          <div class="stat-info">
            <div class="stat-value" id="stat-stories">-</div>
            <div class="stat-label">Published Stories</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i data-lucide="file-text"></i></div>
          <div class="stat-info">
            <div class="stat-value" id="stat-drafts">-</div>
            <div class="stat-label">Drafts</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i data-lucide="mail"></i></div>
          <div class="stat-info">
            <div class="stat-value" id="stat-messages">-</div>
            <div class="stat-label">New Messages</div>
          </div>
        </div>
      </div>

      <div class="dashboard-section">
        <h2>Quick Actions</h2>
        <div class="action-grid">
          <a href="/dashboard/stories.html" class="action-card">
            <i data-lucide="plus"></i>
            <span>New Story</span>
          </a>
          <a href="/dashboard/landing.html" class="action-card">
            <i data-lucide="home"></i>
            <span>Edit Landing Page</span>
          </a>
          <a href="/dashboard/messages.html" class="action-card">
            <i data-lucide="mail"></i>
            <span>View Messages</span>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/main.js"></script>
  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
